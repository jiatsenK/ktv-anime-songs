<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KTV 動漫歌點播站</title>
<meta name="description" content="台灣 KTV 可點播的日文動漫歌曲查詢：歌名、歌手、動漫、年份、各家 KTV 一次查。">
<meta name="theme-color" content="#ff7eb6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sakura" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <span class="logo">🎤</span>
    <div>
      <h1>KTV 動漫歌點播站</h1>
      <p class="sub">アニソン・カラオケ検索 ✦ <span id="count">…</span> 首已確認</p>
    </div>
  </div>
  <div class="searchbox">
    <span class="mag">🔍</span>
    <input id="q" type="search" placeholder="搜尋歌名、歌手、動漫…（中／日／英、假名、羅馬拼音皆可）" autocomplete="off">
  </div>
  <nav class="tabs" role="tablist">
    <button data-tab="all" class="on">全部</button>
    <button data-tab="artist">歌手</button>
    <button data-tab="anime">動漫</button>
    <button data-tab="year">年份</button>
    <button data-tab="ktv">各家KTV</button>
    <button data-tab="fav">♥ 我的歌單</button>
  </nav>
</header>

<main>
  <section id="facet" class="facet"></section>
  <div id="filterbar" class="filterbar"></div>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>找不到符合的歌曲 (´・ω・`)<br>試試其他關鍵字，或<a href="#" data-open="feedback">告訴我們想新增的歌</a></p>
</main>

<footer class="foot">
  <div class="legend"><span class="lamp on">✓</span>可點播 <span class="lamp off">✕</span>無 <span class="lamp unk">?</span>待確認 <span class="badge dance">舞</span>有舞蹈 MV／舞曲</div>
  <div class="actions">
    <button data-open="feedback">💌 內容反饋</button>
    <button data-open="report">🐞 錯誤回報</button>
    <button data-open="donate">☕ 贊助支持</button>
  </div>
  <p class="upd">資料更新：<span id="updated"></span>　僅顯示已確認曲目，待確認資料將於表單更新後同步。</p>
</footer>

<dialog id="dlg"><form method="dialog" class="dlg"><div id="dlgbody"></div><button class="close" value="x" aria-label="關閉">✕</button></form></dialog>
<div id="toast" class="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
